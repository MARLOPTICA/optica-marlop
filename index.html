  <style>
    body {
      margin: 0;
      font-family: 'Cinzel', serif;
      background: #000000;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      color: #D4AF37;
    }

    /* 🔹 Animación fade-in desde abajo escalonada */
    .fade-in {
      opacity: 0;
      transform: translateY(30px);
      animation: fadeInUp 1s ease forwards;
    }

    .fade-in.logo { animation-delay: 0.2s; }
    .fade-in.slogan { animation-delay: 0.7s; }
    .fade-in.title { animation-delay: 1.2s; }
    .fade-in.buttons { animation-delay: 1.7s; }

    @keyframes fadeInUp {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    header {
      margin-top: 20px;
    }

    header img {
      max-width: 280px;
      height: auto;
      transition: transform 0.3s ease;
    }

    header img:hover {
      transform: scale(1.05);
    }

    header p {
      color: #D4AF37;
      font-size: 18px;
      margin-top: 10px;
      text-transform: uppercase;
    }

    h1 {
      font-size: 28px;
      margin: 20px 0;
      color: #D4AF37;
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
    }

    .button-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 15px;
      margin: 20px;
      width: 90%;
      max-width: 800px;
    }

    .button {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 12px 20px;
      font-size: 18px;
      font-weight: 600;
      color: #D4AF37;
      background: #000000;
      border: 2px solid #D4AF37;
      border-radius: 12px;
      text-decoration: none;
      box-shadow: 2px 2px 6px rgba(212, 175, 55, 0.4);
      transition: all 0.3s ease, box-shadow 0.3s ease;
      cursor: pointer;
      touch-action: manipulation;
    }

    .button:hover {
      background: #D4AF37;
      color: #000000;
      transform: scale(1.05);
      box-shadow: 0 0 12px rgba(212, 175, 55, 0.8);
    }

    footer {
      margin-top: auto;
      padding: 15px;
      font-size: 14px;
      color: #D4AF37;
    }
  </style>
